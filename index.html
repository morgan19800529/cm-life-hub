    let map;
    let markers = [];
    let userMarker = null;
    let currentPersona = 'all';
    let isMapModeOnMobile = false;
    let activeRideTarget = null;

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([18.7883, 98.9853], 12);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      L.control.zoom({ position: 'bottomright' }).addTo(map);

      setPersonaMode('all');
    }

    function toggleMobileView() {
      const listView = document.getElementById("listView");
      const mapView = document.getElementById("mapView");
      const toggleText = document.getElementById("toggleText");
      const toggleIcon = document.querySelector("#mobileToggleBtn i");

      isMapModeOnMobile = !isMapModeOnMobile;

      if (isMapModeOnMobile) {
        listView.classList.add("hidden");
        mapView.classList.remove("hidden");
        toggleText.textContent = "返回查看列表";
        toggleIcon.className = "fa-solid fa-list-ul text-blue-400";
        setTimeout(() => map.invalidateSize(), 200);
      } else {
        mapView.classList.add("hidden");
        listView.classList.remove("hidden");
        toggleText.textContent = "切换到大地图模式";
        toggleIcon.className = "fa-solid fa-map text-blue-400";
      }
    }

    function setPersonaMode(mode) {
      currentPersona = mode;
      
      const allTabs = ['all', 'sports', 'school', 'cafe', 'restaurant', 'market_super', 'gov', 'mall', 'hospital', 'market'];
      allTabs.forEach(m => {
        const btn = document.getElementById(`tab-${m}`);
        if (btn) {
          if (m === mode) {
            btn.className = "px-3 py-1 rounded-full bg-blue-600 text-white font-medium shadow-xs shrink-0 text-xs";
          } else {
            btn.className = "px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs";
          }
        }
      });

      applyFilter();
    }

    function openRideModal(item) {
      activeRideTarget = item;
      document.getElementById("rideDestName").textContent = `目的地：${item.nameZh}`;
      document.getElementById("rideModal").classList.remove("hidden");
    }

    function closeRideModal() {
      document.getElementById("rideModal").classList.add("hidden");
    }

    function callGrabApp() {
      if (!activeRideTarget) return;
      const { lat, lng, nameZh } = activeRideTarget;
      const destName = encodeURIComponent(nameZh);

      const grabAppUrl = `grab://open?screenType=BOOKING&dropoff_latitude=${lat}&dropoff_longitude=${lng}&dropoff_name=${destName}`;
      const grabWebUrl = `https://r.grab.com/`;

      const startTime = Date.now();
      window.location.href = grabAppUrl;

      setTimeout(() => {
        if (Date.now() - startTime < 1800) {
          if (confirm("检测到手机可能未安装 Grab App，是否直接打开 Grab 网页版叫车？")) {
            window.open(grabWebUrl, "_blank");
          }
        }
      }, 1500);

      closeRideModal();
    }

    function callBoltApp() {
      if (!activeRideTarget) return;
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

      const boltAppUrl = `bolt://`;
      const storeUrl = isIOS 
        ? "https://apps.apple.com/app/bolt-fast-affordable-rides/id675033630"
        : "https://play.google.com/store/apps/details?id=ee.mtakso.client";

      const startTime = Date.now();
      window.location.href = boltAppUrl;

      setTimeout(() => {
        if (Date.now() - startTime < 1800) {
          if (confirm("未检测到 Bolt App，是否前往应用商店下载安装？")) {
            window.open(storeUrl, "_blank");
          }
        }
      }, 1500);

      closeRideModal();
    }

    function copyCurrentAddress() {
      if (!activeRideTarget) return;
      copyToClipboard(activeRideTarget.addressTh, '泰文打车地址');
      closeRideModal();
    }

    function openLightbox(imgUrl) {
      document.getElementById("lightboxImg").src = imgUrl;
      document.getElementById("imageLightbox").classList.remove("hidden");
    }

    function closeLightbox() {
      document.getElementById("imageLightbox").classList.add("hidden");
    }

    function renderMarkers(dataList) {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      dataList.forEach(item => {
        const marker = L.marker([item.lat, item.lng], { title: item.nameZh }).addTo(map);
        const coverImg = (item.realPhotos && item.realPhotos.length > 0) ? item.realPhotos[0] : "";

        const popupContent = `
          <div class="text-xs max-w-[270px]">
            ${coverImg ? `
              <div class="w-full h-28 overflow-hidden rounded-xl mb-1.5 bg-slate-200">
                <img src="${coverImg}" class="w-full h-full object-cover" alt="实况图" />
              </div>
            ` : ''}
            <div class="font-bold text-slate-900 text-sm mb-0.5">${item.nameZh}</div>
            <div class="text-blue-800 font-semibold mb-1"><i class="fa-regular fa-clock"></i> ${item.time}</div>
            <button onclick="openRideModal(${JSON.stringify(item).replace(/"/g, '&quot;')})" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-1.5 rounded-lg text-xs font-semibold mb-1.5 shadow-xs">
              <i class="fa-solid fa-taxi mr-1"></i> 一键打车前往 (Grab / Bolt)
            </button>
            <a href="https://www.google.com/maps/dir/?api=1&destination=${item.lat},${item.lng}" target="_blank" class="block w-full text-center bg-slate-900 text-white py-1.5 rounded-lg text-xs font-semibold">
              导航前往
            </a>
          </div>
        `;
        marker.bindPopup(popupContent);
        marker.placeId = item.id;
        markers.push(marker);
      });
    }

    function renderCards(dataList) {
      const container = document.getElementById("placeCardList");
      const countEl = document.getElementById("placeCount");
      countEl.textContent = `共呈现 ${dataList.length} 处地点`;

      if (dataList.length === 0) {
        container.innerHTML = `
          <div class="py-12 text-center text-slate-400 text-xs">
            <i class="fa-solid fa-compass text-2xl mb-2 text-blue-500"></i>
            <p>暂无符合筛选条件的位置</p>
          </div>
        `;
        return;
      }

      container.innerHTML = dataList.map(item => {
        const itemJson = JSON.stringify(item).replace(/"/g, '&quot;');
        const googleReviewsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((item.nameEn || item.nameZh) + ' Chiang Mai')}`;

        return `
          <div id="card-${item.id}" onclick="focusPlaceFromCard(${item.id})" class="bg-white border border-slate-200 rounded-2xl overflow-hidden hover:border-blue-400 transition cursor-pointer shadow-xs active:bg-slate-50 flex flex-col">
            
            <!-- 官方真实实景多图展示 -->
            ${item.realPhotos && item.realPhotos.length > 0 ? `
              <div class="w-full h-44 bg-slate-100 flex gap-1.5 overflow-x-auto no-scrollbar p-1.5 shrink-0" onclick="event.stopPropagation();">
                ${item.realPhotos.map(photo => `
                  <div class="h-full flex-1 min-w-[240px] md:min-w-[260px] relative rounded-xl overflow-hidden group">
                    <img src="${photo}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="真实实景" onclick="openLightbox('${photo}')" onerror="this.src='https://images.unsplash.com/photo-1512343879784-a960bf40e7f2?w=600&auto=format&fit=crop&q=80'" />
                    <span class="absolute bottom-1.5 right-1.5 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded backdrop-blur-xs">
                      <i class="fa-solid fa-magnifying-glass-plus"></i> 点击看大图
                    </span>
                  </div>
                `).join("")}
              </div>
            ` : ''}

            <div class="p-3">
              <div class="flex justify-between items-start mb-1">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="text-[10px] bg-blue-100 text-blue-900 font-bold px-2 py-0.5 rounded">
                    ${item.category}
                  </span>
                </div>
                <span class="text-xs text-slate-500 font-medium shrink-0 ml-1">
                  <i class="fa-solid fa-location-dot text-rose-500"></i> ${item.district}
                  ${item.distance ? `<b class="text-blue-700 ml-0.5">(${item.distance}km)</b>` : ''}
                </span>
              </div>

              <h3 class="font-bold text-slate-900 text-base leading-snug">${item.nameZh}</h3>
              <p class="text-[11px] text-slate-400 mb-2">${item.nameEn || ''}</p>

              <div class="space-y-1.5 text-xs text-slate-700 bg-slate-50/80 p-2.5 rounded-xl border border-slate-100 mb-2">
                <div class="flex items-center gap-1.5">
                  <i class="fa-regular fa-clock text-blue-600 w-3.5 shrink-0"></i>
                  <span><b>时间/时段：</b>${item.time}</span>
                </div>

                ${item.highlight ? `
                  <div class="flex items-start gap-1.5 text-slate-800">
                    <i class="fa-solid fa-star text-amber-500 w-3.5 mt-0.5 shrink-0"></i>
                    <span><b>实况/特色：</b>${item.highlight}</span>
                  </div>
                ` : ''}

                ${item.tel ? `
                  <div class="flex items-center gap-1.5 pt-1 border-t border-slate-200/50">
                    <i class="fa-solid fa-phone text-blue-600 w-3.5 shrink-0"></i>
                    <a href="tel:${item.tel}" onclick="event.stopPropagation();" class="text-blue-700 font-semibold underline">电话：${item.tel}</a>
                  </div>
                ` : ''}
              </div>

              <p class="text-[11px] text-slate-500 mb-2.5 leading-relaxed">
                <i class="fa-regular fa-comment-dots text-slate-400"></i> ${item.tips}
              </p>

              <!-- Google 官方评价相册直达 -->
              <a href="${googleReviewsUrl}" target="_blank" onclick="event.stopPropagation();" class="w-full mb-2 bg-slate-100 hover:bg-slate-200 text-slate-800 py-1.5 px-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 border border-slate-200 transition">
                <i class="fa-solid fa-camera text-blue-600"></i> 查看 Google Maps 现场照片与评价
              </a>

              <!-- 核心按钮组：智能打车 + 地图导航 -->
              <div class="grid grid-cols-2 gap-2">
                <button onclick="event.stopPropagation(); openRideModal(${itemJson})" class="py-2.5 px-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs transition flex items-center justify-center gap-1.5 font-semibold shadow-sm active:scale-95">
                  <i class="fa-solid fa-taxi"></i> 一键打车前往
                </button>
                <a href="https://www.google.com/maps/dir/?api=1&destination=${item.lat},${item.lng}" target="_blank" onclick="event.stopPropagation();" class="py-2.5 px-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs text-center font-semibold transition flex items-center justify-center gap-1 active:scale-95">
                  <i class="fa-solid fa-diamond-turn-right text-blue-400"></i> 导航前往
                </a>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function focusPlaceFromCard(id) {
      if (window.innerWidth < 768) {
        toggleMobileView();
      }
      setTimeout(() => {
        const place = places.find(c => c.id === id);
        const marker = markers.find(m => m.placeId === id);
        if (place && marker) {
          map.flyTo([place.lat, place.lng], 14, { duration: 1 });
          marker.openPopup();
        }
      }, 250);
    }

    function applyFilter() {
      const search = document.getElementById("searchInput").value.trim().toLowerCase();
      const district = document.getElementById("districtFilter").value;

      const filtered = places.filter(item => {
        if (currentPersona !== 'all' && item.type !== currentPersona) {
          return false;
        }

        const matchesSearch = !search || 
          item.nameZh.toLowerCase().includes(search) || 
          (item.nameEn && item.nameEn.toLowerCase().includes(search)) || 
          (item.highlight && item.highlight.toLowerCase().includes(search)) ||
          item.tips.toLowerCase().includes(search) ||
          item.category.toLowerCase().includes(search) ||
          item.district.toLowerCase().includes(search);

        const matchesDistrict = !district || item.district.includes(district);

        return matchesSearch && matchesDistrict;
      });

      renderMarkers(filtered);
      renderCards(filtered);
    }

    function locateUser() {
      if (!navigator.geolocation) {
        alert("手机暂不支持定位功能");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => {
          const uLat = pos.coords.latitude;
          const uLng = pos.coords.longitude;

          if (userMarker) map.removeLayer(userMarker);
          userMarker = L.circleMarker([uLat, uLng], {
            radius: 8,
            fillColor: "#2563eb",
            color: "#ffffff",
            weight: 3,
            opacity: 1,
            fillOpacity: 0.9
          }).addTo(map).bindPopup("<b>您所在的位置</b>").openPopup();

          places.forEach(c => {
            c.distance = calculateDistance(uLat, uLng, c.lat, c.lng).toFixed(1);
          });
          places.sort((a, b) => parseFloat(a.distance) - parseFloat(b.distance));
          applyFilter();
          alert("已定位成功！所有地点已按与您的距离由近到远重新排序。");
        },
        err => {
          alert("无法获取定位权限，请在手机设置中允许浏览器访问位置。");
        }
      );
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function copyToClipboard(text, label) {
      navigator.clipboard.writeText(text).then(() => {
        alert(`已复制【${label}】：\n\n${text}\n\n可以直接发给司机或出示给双条车司机查看。`);
      });
    }

    function openModal() {
      document.getElementById("feedbackModal").classList.remove("hidden");
    }
    function closeModal() {
      document.getElementById("feedbackModal").classList.add("hidden");
    }
    function handleFeedbackSubmit(e) {
      e.preventDefault();
      alert("感谢提报！我们会尽快核准更新。");
      closeModal();
    }

    window.onload = initMap;
  </script>
</body>
</html>
