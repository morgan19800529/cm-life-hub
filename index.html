<!DOCTYPE html>

  <!-- 强制浏览器实时拉取最新版本，禁止强缓存锁死 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>清迈华人旅居生活全景指南 | Chiang Mai Living Hub</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Leaflet 地图引擎 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .leaflet-popup-content-wrapper { border-radius: 16px; padding: 4px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2); }
    .leaflet-popup-content { margin: 8px 12px; line-height: 1.45; }
    input, select, textarea { font-size: 16px !important; }
    @media (min-width: 768px) {
      input, select, textarea { font-size: 12px !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 h-[100dvh] w-screen flex flex-col overflow-hidden font-sans select-none">

    <div class="px-3.5 py-2 flex justify-between items-center max-w-7xl mx-auto">
      <div class="flex items-center space-x-2">

          <i class="fa-solid fa-compass text-sm"></i>
        </div>
        <div>

      </div>
      
      <div class="flex items-center gap-1.5">
        <button onclick="locateUser()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-2.5 py-1.5 rounded-lg border border-slate-300 transition flex items-center gap-1 font-medium">
          <i class="fa-solid fa-location-crosshairs text-blue-600"></i> 定位
        </button>
        <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-2.5 py-1.5 rounded-lg shadow-sm transition">
          提报
        </button>
      </div>
    </div>

    <!-- 顶部分类导航（教会居中排布） -->
    <div class="bg-blue-50/50 border-t border-blue-100/60 px-3 py-1.5 flex items-center gap-1.5 text-xs overflow-x-auto no-scrollbar">

      <button onclick="setPersonaMode('market_super')" id="tab-market_super" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">🛒 大型超市 (12)</button>
      <button onclick="setPersonaMode('market')" id="tab-market" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">🧺 烟火市集 (10)</button>
      <button onclick="setPersonaMode('cafe')" id="tab-cafe" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">☕ 精选咖啡 (50)</button>
      <button onclick="setPersonaMode('restaurant')" id="tab-restaurant" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">🍴 特色美食 (25)</button>
      <!-- 居中放置的教会模块 -->
      <button onclick="setPersonaMode('church')" id="tab-church" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">⛪ 基督教会 (18)</button>
      <button onclick="setPersonaMode('sports')" id="tab-sports" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">🏅 运动健身 (20)</button>
      <button onclick="setPersonaMode('school')" id="tab-school" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">🎓 国际学校 (21)</button>
      <button onclick="setPersonaMode('gov')" id="tab-gov" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">🏛️ 政务使馆 (5)</button>
      <button onclick="setPersonaMode('mall')" id="tab-mall" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">🛍️ 购物中心 (4)</button>
      <button onclick="setPersonaMode('hospital')" id="tab-hospital" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">🏥 重点医院 (4)</button>
    </div>

    <!-- 搜索与区域过滤 -->
    <div class="bg-slate-50 border-t border-slate-200 px-3 py-1.5 flex items-center gap-2">
      <div class="relative flex-1">
        <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-slate-400 text-xs"></i>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="搜超市、法汉堂、CCF、云南早市、乒乓球、ABA学校、移民局..." 
          class="w-full pl-7 pr-3 py-1 bg-white border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-blue-500"
          oninput="applyFilter()"
        />
      </div>

      <select id="districtFilter" onchange="applyFilter()" class="bg-white border border-slate-200 rounded-lg px-2 py-1 text-slate-700 text-xs focus:outline-none">
        <option value="">全部区域</option>
        <option value="古城">古城区</option>
        <option value="宁曼路">宁曼/清大</option>
        <option value="湄海">湄海区 (Mae Hia)</option>
        <option value="杭东">杭东走廊 (Hang Dong)</option>
        <option value="长康路">长康路/萍河</option>
        <option value="瓦特盖特">瓦特盖特/麦考密克</option>
        <option value="三塞">三塞/Central Fest</option>
        <option value="运河路">运河路/湄林</option>
        <option value="沙拉丕">沙拉丕 (Saraphi)</option>
      </select>
    </div>
  </header>

  <!-- 主展示区域 -->

    <!-- 列表视图 -->

      <div class="px-3.5 py-1.5 border-b border-slate-100 flex justify-between items-center text-xs text-slate-500 bg-slate-50">
        <span id="placeCount" class="font-medium">正在渲染全量点位...</span>
        <span class="text-[11px] text-slate-400">稳定直通 Grab / Bolt</span>
      </div>

      <div id="placeCardList" class="flex-1 overflow-y-auto divide-y divide-slate-100 p-2.5 space-y-3 pb-24 md:pb-6">
        <!-- 动态卡片 -->
      </div>
    </aside>

    <!-- 地图视图 -->
    <main id="mapView" class="hidden md:block flex-1 h-full relative z-0 bg-slate-200">
      <div id="map" class="w-full h-full"></div>
    </main>
  </div>

  <!-- 手机端浮动切换胶囊 -->
  <div class="md:hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-40">
    <button onclick="toggleMobileView()" id="mobileToggleBtn" class="bg-slate-900/90 backdrop-blur text-white px-5 py-2.5 rounded-full shadow-xl flex items-center gap-2 text-xs font-semibold active:scale-95 transition tracking-wide border border-white/10">
      <i class="fa-solid fa-map text-blue-400"></i>
      <span id="toggleText">切换到大地图模式</span>
    </button>
  </div>

  <!-- 打车服务选择弹窗 -->

            <i class="fa-solid fa-taxi text-emerald-600"></i> 选择打车前往
          </h3>
          <p id="rideDestName" class="text-[11px] text-slate-400 truncate max-w-[240px]"></p>
        </div>
        <button onclick="closeRideModal()" class="text-slate-400 hover:text-slate-600 text-lg px-2">✕</button>
      </div>

      <div class="space-y-2 text-xs">
        <!-- 1. 呼叫 Grab -->
        <button onclick="callGrab()" class="w-full p-3 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 rounded-xl flex items-center justify-between transition text-left active:scale-95">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-emerald-600 text-white font-bold flex items-center justify-center text-sm shadow-xs">G</div>
            <div>
              <div class="font-bold text-emerald-950">呼叫 Grab (全城覆盖)</div>
              <div class="text-[10px] text-emerald-700">自动唤起App带入定位 · 未安装前往下载</div>
            </div>
          </div>
          <i class="fa-solid fa-angle-right text-emerald-600"></i>
        </button>

        <!-- 2. 呼叫 Bolt -->
        <button onclick="callBolt()" class="w-full p-3 bg-green-50 hover:bg-green-100 border border-green-200 rounded-xl flex items-center justify-between transition text-left active:scale-95">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-green-500 text-white font-bold flex items-center justify-center text-sm shadow-xs">B</div>
            <div>
              <div class="font-bold text-green-950">呼叫 Bolt (高性价比)</div>
              <div class="text-[10px] text-green-700">车费通常实惠 20% · 自动唤起</div>
            </div>
          </div>
          <i class="fa-solid fa-angle-right text-green-600"></i>
        </button>

        <!-- 3. Google Maps 打车比价聚合 (全环境兜底) -->
        <button onclick="callGoogleRide()" class="w-full p-2.5 bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-900 rounded-xl flex items-center justify-center gap-1.5 font-medium transition text-xs active:scale-95">
          <i class="fa-brands fa-google text-blue-600"></i> 通过 Google 地图比价叫车 (聚合通道)
        </button>

        <!-- 4. 复制泰文地址给现场司机 -->
        <button onclick="copyCurrentAddress()" class="w-full p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl flex items-center justify-center gap-1.5 font-medium transition active:scale-95">
          <i class="fa-regular fa-copy text-slate-500"></i> 复制泰文地址（出示给双条车/TukTuk）
        </button>
      </div>
    </div>
  </div>

  <!-- 纠错提报弹窗 -->

    <div class="bg-white rounded-2xl max-w-md w-full p-4 space-y-3 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-100 pb-2">
        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
          <i class="fa-solid fa-pen-to-square text-blue-600"></i> 提交生活点位
        </h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg px-2">✕</button>
      </div>

      <form onsubmit="handleFeedbackSubmit(event)" class="space-y-2.5 text-xs">
        <div>
          <label class="block font-medium text-slate-700 mb-1">地点名称</label>
          <input required type="text" id="fbName" class="w-full p-2 border border-slate-200 rounded-lg bg-slate-50" placeholder="输入名称" />
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">补充详情</label>
          <textarea required id="fbContent" rows="3" class="w-full p-2 border border-slate-200 rounded-lg bg-slate-50" placeholder="营业时间、服务等"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-1">
          <button type="button" onclick="closeModal()" class="px-3.5 py-1.5 border border-slate-200 rounded-lg text-slate-600">取消</button>
          <button type="submit" class="px-4 py-1.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">确认提交</button>
        </div>
      </form>
    </div>
  </div>

    let map;
    let markers = [];
    let userMarker = null;
    let currentPersona = 'all';
    let isMapModeOnMobile = false;
    let activeRideTarget = null;

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([18.7883, 98.9853], 12);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      L.control.zoom({ position: 'bottomright' }).addTo(map);

      setPersonaMode('all');
    }

    function toggleMobileView() {
      const listView = document.getElementById("listView");
      const mapView = document.getElementById("mapView");
      const toggleText = document.getElementById("toggleText");
      const toggleIcon = document.querySelector("#mobileToggleBtn i");

      isMapModeOnMobile = !isMapModeOnMobile;

      if (isMapModeOnMobile) {
        listView.classList.add("hidden");
        mapView.classList.remove("hidden");
        toggleText.textContent = "返回查看列表";
        toggleIcon.className = "fa-solid fa-list-ul text-blue-400";
        setTimeout(() => map.invalidateSize(), 200);
      } else {
        mapView.classList.add("hidden");
        listView.classList.remove("hidden");
        toggleText.textContent = "切换到大地图模式";
        toggleIcon.className = "fa-solid fa-map text-blue-400";
      }
    }

    function setPersonaMode(mode) {
      currentPersona = mode;
      
      const allTabs = ['all', 'market_super', 'market', 'cafe', 'restaurant', 'church', 'sports', 'school', 'gov', 'mall', 'hospital'];
      allTabs.forEach(m => {
        const btn = document.getElementById(`tab-${m}`);
        if (btn) {
          if (m === mode) {
            btn.className = "px-3 py-1 rounded-full bg-blue-600 text-white font-medium shadow-xs shrink-0 text-xs";
          } else {
            btn.className = "px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs";
          }
        }
      });

      applyFilter();
    }

    // ==========================================
    // 🚗 智能打车底层处理（防拦截 + 自动带入定位）
    // ==========================================
    function openRideModal(id) {
      const item = places.find(p => p.id === id);
      if (!item) return;
      activeRideTarget = item;
      document.getElementById("rideDestName").textContent = `目的地：${item.nameZh}`;
      document.getElementById("rideModal").classList.remove("hidden");
    }

    function closeRideModal() {
      document.getElementById("rideModal").classList.add("hidden");
    }

    // 1. 呼叫 Grab
    function callGrab() {
      if (!activeRideTarget) return;
      const { lat, lng, nameZh } = activeRideTarget;
      const destName = encodeURIComponent(nameZh);

      // Grab 官方原生深度调起协议（直接带入下车经纬度与名称）
      const grabAppUrl = `grab://open?screenType=BOOKING&dropoff_latitude=${lat}&dropoff_longitude=${lng}&dropoff_name=${destName}`;
      
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const downloadUrl = isIOS 
        ? "https://apps.apple.com/app/grab-superapp/id647268330"
        : "https://play.google.com/store/apps/details?id=com.grabtaxi.passenger";

      const t0 = Date.now();
      window.location.href = grabAppUrl;

      // 手机若无 App，自动降级打开应用商店
      setTimeout(() => {
        if (Date.now() - t0 < 2200) {
          window.location.href = downloadUrl;
        }
      }, 1500);

      closeRideModal();
    }

    // 2. 呼叫 Bolt
    function callBolt() {
      if (!activeRideTarget) return;
      const boltAppUrl = "bolt://";
      
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const downloadUrl = isIOS 
        ? "https://apps.apple.com/app/bolt-fast-affordable-rides/id675033630"
        : "https://play.google.com/store/apps/details?id=ee.mtakso.client";

      const t0 = Date.now();
      window.location.href = boltAppUrl;

      setTimeout(() => {
        if (Date.now() - t0 < 2200) {
          window.location.href = downloadUrl;
        }
      }, 1500);

      closeRideModal();
    }

    // 3. Google 地图官方比价聚合叫车通道
    function callGoogleRide() {
      if (!activeRideTarget) return;
      const { lat, lng } = activeRideTarget;
      window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`, "_blank");
      closeRideModal();
    }

    function copyCurrentAddress() {
      if (!activeRideTarget) return;
      copyToClipboard(activeRideTarget.addressTh, '泰文打车地址');
      closeRideModal();
    }

    function renderMarkers(dataList) {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      dataList.forEach(item => {
        const marker = L.marker([item.lat, item.lng], { title: item.nameZh }).addTo(map);

        const popupContent = `
          <div class="text-xs max-w-[270px]">
            <div class="font-bold text-slate-900 text-sm mb-0.5">${item.nameZh}</div>
            <div class="text-blue-800 font-semibold mb-1"><i class="fa-regular fa-clock"></i> ${item.time}</div>
            <button onclick="openRideModal(${item.id})" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-1.5 rounded-lg text-xs font-semibold mb-1.5 shadow-xs">
              <i class="fa-solid fa-taxi mr-1"></i> 一键打车前往 (Grab / Bolt)
            </button>
            <a href="https://www.google.com/maps/dir/?api=1&destination=${item.lat},${item.lng}" target="_blank" class="block w-full text-center bg-slate-900 text-white py-1.5 rounded-lg text-xs font-semibold">
              导航前往
            </a>
          </div>
        `;
        marker.bindPopup(popupContent);
        marker.placeId = item.id;
        markers.push(marker);
      });
    }

            </div>

            <div class="p-3">

                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="text-[10px] bg-blue-100 text-blue-900 font-bold px-2 py-0.5 rounded">
                    ${item.category}

                </div>
                <span class="text-xs text-slate-500 font-medium shrink-0 ml-1">

                  ${item.distance ? `<b class="text-blue-700 ml-0.5">(${item.distance}km)</b>` : ''}
                </span>
              </div>

              <h3 class="font-bold text-slate-900 text-base leading-snug">${item.nameZh}</h3>
              <p class="text-[11px] text-slate-400 mb-2">${item.nameEn || ''}</p>

              <div class="space-y-1.5 text-xs text-slate-700 bg-slate-50/80 p-2.5 rounded-xl border border-slate-100 mb-2">
                <div class="flex items-center gap-1.5">
                  <i class="fa-regular fa-clock text-blue-600 w-3.5 shrink-0"></i>
                  <span><b>时间/时段：</b>${item.time}</span>
                </div>

                ${item.highlight ? `
                  <div class="flex items-start gap-1.5 text-slate-800">

                ${item.tel ? `

              <!-- 直连 Google Maps 官方相册 -->
              <a href="${googleReviewsUrl}" target="_blank" onclick="event.stopPropagation();" class="w-full mb-2 bg-slate-100 hover:bg-slate-200 text-slate-800 py-1.5 px-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 border border-slate-200 transition">

                <button onclick="event.stopPropagation(); openRideModal(${item.id})" class="py-2.5 px-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs transition flex items-center justify-center gap-1.5 font-semibold shadow-sm active:scale-95">
                  <i class="fa-solid fa-taxi"></i> 一键打车前往

                <a href="https://www.google.com/maps/dir/?api=1&destination=${item.lat},${item.lng}" target="_blank" onclick="event.stopPropagation();" class="py-2.5 px-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs text-center font-semibold transition flex items-center justify-center gap-1 active:scale-95">

    }

    function focusPlaceFromCard(id) {
      if (window.innerWidth < 768) {
        toggleMobileView();
      }
      setTimeout(() => {
        const place = places.find(c => c.id === id);
        const marker = markers.find(m => m.placeId === id);
        if (place && marker) {
          map.flyTo([place.lat, place.lng], 14, { duration: 1 });
          marker.openPopup();
        }
      }, 250);
    }

    function applyFilter() {
      const search = document.getElementById("searchInput").value.trim().toLowerCase();
      const district = document.getElementById("districtFilter").value;

      const filtered = places.filter(item => {
        if (currentPersona !== 'all' && item.type !== currentPersona) {
          return false;
        }

        const matchesSearch = !search || 
          item.nameZh.toLowerCase().includes(search) || 
          (item.nameEn && item.nameEn.toLowerCase().includes(search)) || 
          (item.highlight && item.highlight.toLowerCase().includes(search)) ||
          item.tips.toLowerCase().includes(search) ||
          item.category.toLowerCase().includes(search) ||
          item.district.toLowerCase().includes(search);

        const matchesDistrict = !district || item.district.includes(district);

        return matchesSearch && matchesDistrict;
      });

      renderMarkers(filtered);
      renderCards(filtered);
    }

    function locateUser() {
      if (!navigator.geolocation) {
        alert("手机暂不支持定位功能");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => {
          const uLat = pos.coords.latitude;
          const uLng = pos.coords.longitude;

          if (userMarker) map.removeLayer(userMarker);
          userMarker = L.circleMarker([uLat, uLng], {
            radius: 8,
            fillColor: "#2563eb",
            color: "#ffffff",
            weight: 3,
            opacity: 1,
            fillOpacity: 0.9
          }).addTo(map).bindPopup("<b>您所在的位置</b>").openPopup();

          places.forEach(c => {
            c.distance = calculateDistance(uLat, uLng, c.lat, c.lng).toFixed(1);
          });
          places.sort((a, b) => parseFloat(a.distance) - parseFloat(b.distance));
          applyFilter();
          alert("已定位成功！所有地点已按与您的距离由近到远重新排序。");
        },
        err => {
          alert("无法获取定位权限，请在手机设置中允许浏览器访问位置。");
        }
      );
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function copyToClipboard(text, label) {
      navigator.clipboard.writeText(text).then(() => {
        alert(`已复制【${label}】：\n\n${text}\n\n可以直接发给司机或出示给双条车司机查看。`);
      });
    }

      document.getElementById("feedbackModal").classList.add("hidden");
    }

      e.preventDefault();
      alert("感谢提报！我们会尽快核准更新。");
