      input, select, textarea { font-size: 12px !important; }

        </div>

      <button onclick="setPersonaMode('malls')" id="tab-malls" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">🛍️ 购物中心 (4)</button>
      <button onclick="setPersonaMode('hospitals')" id="tab-hospitals" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">🏥 重点医院 (4)</button>
      <button onclick="setPersonaMode('markets_super')" id="tab-markets_super" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">🛒 大型超市 (4)</button>

        <!-- 动态卡片 -->
      </div>
    </aside>

      <div id="map" class="w-full h-full"></div>
    </main>
  </div>

      <span id="toggleText">切换到大地图模式</span>
    </button>
  </div>

  <!-- 4. 纠错提报弹窗 -->

        </h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg px-2">✕</button>
      </div>

        </div>
        <div>

        </div>
      </form>

    let map;

    let userMarker = null;
    let currentPersona = 'all';
    let isMapModeOnMobile = false;

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([18.7883, 98.9853], 12);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      L.control.zoom({ position: 'bottomright' }).addTo(map);

      setPersonaMode('all');
    }

    function toggleMobileView() {
      const listView = document.getElementById("listView");
      const mapView = document.getElementById("mapView");
      const toggleText = document.getElementById("toggleText");
      const toggleIcon = document.querySelector("#mobileToggleBtn i");

      isMapModeOnMobile = !isMapModeOnMobile;

      if (isMapModeOnMobile) {
        listView.classList.add("hidden");
        mapView.classList.remove("hidden");
        toggleText.textContent = "返回查看列表";
        toggleIcon.className = "fa-solid fa-list-ul text-blue-400";
        setTimeout(() => map.invalidateSize(), 200);
      } else {
        mapView.classList.add("hidden");
        listView.classList.remove("hidden");
        toggleText.textContent = "切换到大地图模式";
        toggleIcon.className = "fa-solid fa-map text-blue-400";
      }
    }

    function setPersonaMode(mode) {
      currentPersona = mode;
      
      ['all', 'gov', 'malls', 'schools', 'hospitals', 'markets_super', 'michelin', 'sports', 'cafes', 'markets'].forEach(m => {
        const btn = document.getElementById(`tab-${m}`);
        if (btn) {
          if (m === mode) {
            btn.className = "px-3 py-1 rounded-full bg-blue-600 text-white font-medium shadow-xs shrink-0 text-xs";
          } else {
            btn.className = "px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs";
          }
        }
      });

      applyFilter();
    }

    function renderMarkers(dataList) {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      dataList.forEach(item => {
        const marker = L.marker([item.lat, item.lng], { title: item.nameZh }).addTo(map);

        let typeBadge = '';

        else if (item.type === 'mall') typeBadge = '<span class="bg-fuchsia-100 text-fuchsia-800 text-[10px] px-1.5 py-0.5 rounded font-medium">🛍️ 购物中心</span>';
        else if (item.type === 'school') typeBadge = '<span class="bg-purple-100 text-purple-800 text-[10px] px-1.5 py-0.5 rounded font-medium">🎓 国际学校</span>';

        const popupContent = `

            <img src="${item.photo}" class="w-full h-28 object-cover rounded-xl mb-2" alt="${item.nameZh}" />

    function focusPlaceFromCard(id) {
      if (window.innerWidth < 768) {
        toggleMobileView();
      }
      setTimeout(() => {
        const place = places.find(c => c.id === id);
        const marker = markers.find(m => m.placeId === id);
        if (place && marker) {
          map.flyTo([place.lat, place.lng], 14, { duration: 1 });
          marker.openPopup();
        }
      }, 250);
    }

    function applyFilter() {
      const search = document.getElementById("searchInput").value.trim().toLowerCase();
      const district = document.getElementById("districtFilter").value;

      const filtered = places.filter(item => {
        if (currentPersona === 'gov' && item.type !== 'gov') return false;
        if (currentPersona === 'malls' && item.type !== 'mall') return false;
        if (currentPersona === 'schools' && item.type !== 'school') return false;
        if (currentPersona === 'hospitals' && item.type !== 'hospital') return false;
        if (currentPersona === 'markets_super' && item.type !== 'market_super') return false;
        if (currentPersona === 'michelin' && item.type !== 'michelin') return false;
        if (currentPersona === 'sports' && item.type !== 'sports') return false;
        if (currentPersona === 'cafes' && item.type !== 'cafe') return false;
        if (currentPersona === 'markets' && item.type !== 'market') return false;

        const matchesSearch = !search || 
          item.nameZh.toLowerCase().includes(search) || 
          item.nameEn.toLowerCase().includes(search) || 
          (item.highlight && item.highlight.toLowerCase().includes(search)) ||
          item.tips.toLowerCase().includes(search) ||
          item.category.toLowerCase().includes(search) ||
          item.district.toLowerCase().includes(search);

        const matchesDistrict = !district || item.district.includes(district);

        return matchesSearch && matchesDistrict;
      });

      renderMarkers(filtered);
      renderCards(filtered);
    }

    function locateUser() {
      if (!navigator.geolocation) {
        alert("手机暂不支持定位功能");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => {
          const uLat = pos.coords.latitude;
          const uLng = pos.coords.longitude;

          if (userMarker) map.removeLayer(userMarker);
          userMarker = L.circleMarker([uLat, uLng], {
            radius: 8,
            fillColor: "#2563eb",
            color: "#ffffff",
            weight: 3,
            opacity: 1,
            fillOpacity: 0.9
          }).addTo(map).bindPopup("<b>您所在的位置</b>").openPopup();

          places.forEach(c => {
            c.distance = calculateDistance(uLat, uLng, c.lat, c.lng).toFixed(1);
          });
          places.sort((a, b) => parseFloat(a.distance) - parseFloat(b.distance));
          applyFilter();
          alert("已定位成功！所有地点已按与您的距离由近到远重新排序。");
        },
        err => {
          alert("无法获取定位权限，请在手机设置中允许浏览器访问位置。");
        }
      );
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function copyToClipboard(text, label) {
      navigator.clipboard.writeText(text).then(() => {
        alert(`已复制【${label}】：\n\n${text}\n\n可以直接发给 Grab 司机或出示给双条车司机查看。`);
      });
    }

    function openModal() {
      document.getElementById("feedbackModal").classList.remove("hidden");
    }
    function closeModal() {
      document.getElementById("feedbackModal").classList.add("hidden");
    }
    function handleFeedbackSubmit(e) {
      e.preventDefault();
      alert("感谢提报！我们会尽快核准更新。");
      closeModal();
    }

    window.onload = initMap;
  </script>
