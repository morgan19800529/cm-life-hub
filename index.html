<!DOCTYPE html>

  <!-- Tailwind CSS & FontAwesome -->

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Leaflet 地图引擎 -->

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .leaflet-popup-content { margin: 8px 12px; line-height: 1.45; }

    @media (min-width: 768px) {
      input, select, textarea { font-size: 12px !important; }

        </div>
        <div>
          <h1 class="font-bold text-slate-900 text-sm md:text-base leading-tight">清迈旅居生活指南</h1>
          <p class="text-[10px] text-slate-400">智能直连 Grab/Bolt · 真实内景 · 全景导航</p>

      </div>
      
      <div class="flex items-center gap-1.5">
        <button onclick="locateUser()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-2.5 py-1.5 rounded-lg border border-slate-300 transition flex items-center gap-1 font-medium">
          <i class="fa-solid fa-location-crosshairs text-blue-600"></i> 定位
        </button>
        <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-2.5 py-1.5 rounded-lg shadow-sm transition">

        </button>
      </div>
    </div>

    <!-- 顶部分类导航 -->

      <button onclick="setPersonaMode('schools')" id="tab-schools" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">🎓 国际学校</button>
      <button onclick="setPersonaMode('cafes')" id="tab-cafes" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">☕ 精选咖啡</button>
      <button onclick="setPersonaMode('restaurants')" id="tab-restaurants" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">🍴 特色美食</button>
      <button onclick="setPersonaMode('gov')" id="tab-gov" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">🏛️ 政务使馆</button>
      <button onclick="setPersonaMode('malls')" id="tab-malls" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">🛍️ 购物中心</button>
      <button onclick="setPersonaMode('hospitals')" id="tab-hospitals" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">🏥 重点医院</button>
      <button onclick="setPersonaMode('markets_super')" id="tab-markets_super" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">🛒 大型超市</button>
      <button onclick="setPersonaMode('markets')" id="tab-markets" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">🧺 烟火市集</button>
    </div>

    <!-- 搜索与区域过滤 -->
    <div class="bg-slate-50 border-t border-slate-200 px-3 py-1.5 flex items-center gap-2">
      <div class="relative flex-1">
        <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-slate-400 text-xs"></i>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="搜乒乓球、大尚泰二楼、ABA学校、咖喱面..." 
          class="w-full pl-7 pr-3 py-1 bg-white border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-blue-500"
          oninput="applyFilter()"
        />
      </div>

      <select id="districtFilter" onchange="applyFilter()" class="bg-white border border-slate-200 rounded-lg px-2 py-1 text-slate-700 text-xs focus:outline-none">
        <option value="">全部区域</option>

        <option value="宁曼路">宁曼/清大</option>

        <option value="长康路">长康路/萍河</option>
        <option value="三塞">三塞/Central Fest</option>
        <option value="运河路">运河路/湄林</option>

  </header>

        <span id="placeCount" class="font-medium">正在加载点位...</span>
        <span class="text-[11px] text-slate-400">支持一键直达打车软件</span>
      </div>

        <!-- 动态卡片 -->
      </div>
    </aside>

    </main>

        </div>
        <button onclick="closeRideModal()" class="text-slate-400 hover:text-slate-600 text-lg px-2">✕</button>
      </div>

          </div>

        </button>

            <div class="w-8 h-8 rounded-lg bg-green-500 text-white font-bold flex items-center justify-center text-sm shadow-xs">B</div>
            <div class="text-left">
              <div class="font-bold text-green-950">呼叫 Bolt (高性价比)</div>
              <div class="text-[10px] text-green-700">车费通常实惠 20% · 未安装跳转应用商店</div>
            </div>
          </div>
          <i class="fa-solid fa-angle-right text-green-600 group-hover:translate-x-0.5 transition"></i>
        </button>

        <button onclick="copyCurrentAddress()" class="w-full p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl flex items-center justify-center gap-1.5 font-medium transition">

        <div>

          <button type="button" onclick="closeModal()" class="px-3.5 py-1.5 border border-slate-200 rounded-lg text-slate-600">取消</button>
          <button type="submit" class="px-4 py-1.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">确认提交</button>
        </div>
      </form>
    </div>
  </div>

    function toggleMobileView() {
      const listView = document.getElementById("listView");
      const mapView = document.getElementById("mapView");
      const toggleText = document.getElementById("toggleText");
      const toggleIcon = document.querySelector("#mobileToggleBtn i");

      isMapModeOnMobile = !isMapModeOnMobile;

      if (isMapModeOnMobile) {
        listView.classList.add("hidden");
        mapView.classList.remove("hidden");
        toggleText.textContent = "返回查看列表";
        toggleIcon.className = "fa-solid fa-list-ul text-blue-400";
        setTimeout(() => map.invalidateSize(), 200);
      } else {
        mapView.classList.add("hidden");
        listView.classList.remove("hidden");
        toggleText.textContent = "切换到大地图模式";
        toggleIcon.className = "fa-solid fa-map text-blue-400";
      }
    }

    function setPersonaMode(mode) {
      currentPersona = mode;
      
      ['all', 'sports', 'schools', 'cafes', 'restaurants', 'gov', 'malls', 'hospitals', 'markets_super', 'markets'].forEach(m => {
        const btn = document.getElementById(`tab-${m}`);
        if (btn) {
          if (m === mode) {
            btn.className = "px-3 py-1 rounded-full bg-blue-600 text-white font-medium shadow-xs shrink-0 text-xs";

    function openRideModal(item) {
      activeRideTarget = item;
      document.getElementById("rideDestName").textContent = `目的地：${item.nameZh}`;
      document.getElementById("rideModal").classList.remove("hidden");

      document.getElementById("rideModal").classList.add("hidden");

    // 1. 唤起 Grab (已安装调起 App，未安装降级为免下载网页版叫车)
    function callGrabApp() {
      if (!activeRideTarget) return;
      const { lat, lng, nameZh } = activeRideTarget;
      const destName = encodeURIComponent(nameZh);

      // Grab 深度链接协议（直接带入经纬度和目的地名称）
      const grabAppUrl = `grab://open?screenType=BOOKING&dropoff_latitude=${lat}&dropoff_longitude=${lng}&dropoff_name=${destName}`;
      // Grab 官方网页叫车版 (PWA 免安装)
      const grabWebUrl = `https://r.grab.com/`;

      const startTime = Date.now();
      window.location.href = grabAppUrl;

      // 1.5 秒后若仍停留在此页面，判定为未安装 App，弹窗提示并降级打开网页叫车版
      setTimeout(() => {
        if (Date.now() - startTime < 1800) {
          if (confirm("检测到手机可能未安装 Grab App，是否直接打开 Grab 网页版叫车？")) {
            window.open(grabWebUrl, "_blank");
          }
        }
      }, 1500);

      closeRideModal();
    }

    // 2. 唤起 Bolt (已安装调起 App，未安装跳转至应用商店)
    function callBoltApp() {
      if (!activeRideTarget) return;
      const { lat, lng } = activeRideTarget;
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

      // Bolt 深度链接
      const boltAppUrl = `bolt://`;
      // 应用商店下载降级
      const storeUrl = isIOS 
        ? "https://apps.apple.com/app/bolt-fast-affordable-rides/id675033630"
        : "https://play.google.com/store/apps/details?id=ee.mtakso.client";

      const startTime = Date.now();
      window.location.href = boltAppUrl;

      setTimeout(() => {
        if (Date.now() - startTime < 1800) {
          if (confirm("未检测到 Bolt App，是否前往应用商店下载安装？")) {
            window.open(storeUrl, "_blank");
          }
        }
      }, 1500);

      closeRideModal();
    }

              导航前往

    function focusPlaceFromCard(id) {
      if (window.innerWidth < 768) {
        toggleMobileView();
      }
      setTimeout(() => {
        const place = places.find(c => c.id === id);
        const marker = markers.find(m => m.placeId === id);
        if (place && marker) {
          map.flyTo([place.lat, place.lng], 14, { duration: 1 });
          marker.openPopup();
        }
      }, 250);
    }

    function applyFilter() {
      const search = document.getElementById("searchInput").value.trim().toLowerCase();
      const district = document.getElementById("districtFilter").value;

      const filtered = places.filter(item => {
        if (currentPersona === 'sports' && item.type !== 'sports') return false;
        if (currentPersona === 'schools' && item.type !== 'school') return false;
        if (currentPersona === 'cafes' && item.type !== 'cafe') return false;
        if (currentPersona === 'restaurants' && item.type !== 'restaurant') return false;
        if (currentPersona === 'gov' && item.type !== 'gov') return false;
        if (currentPersona === 'malls' && item.type !== 'mall') return false;
        if (currentPersona === 'hospitals' && item.type !== 'hospital') return false;
        if (currentPersona === 'markets_super' && item.type !== 'market_super') return false;
        if (currentPersona === 'markets' && item.type !== 'market') return false;

        const matchesSearch = !search || 
          item.nameZh.toLowerCase().includes(search) || 
          (item.nameEn && item.nameEn.toLowerCase().includes(search)) || 
          (item.highlight && item.highlight.toLowerCase().includes(search)) ||
          item.tips.toLowerCase().includes(search) ||
          item.category.toLowerCase().includes(search) ||
          item.district.toLowerCase().includes(search);

        const matchesDistrict = !district || item.district.includes(district);

        return matchesSearch && matchesDistrict;
      });

      renderMarkers(filtered);
      renderCards(filtered);
    }

    function locateUser() {
      if (!navigator.geolocation) {
        alert("手机暂不支持定位功能");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => {
          const uLat = pos.coords.latitude;
          const uLng = pos.coords.longitude;

          if (userMarker) map.removeLayer(userMarker);
          userMarker = L.circleMarker([uLat, uLng], {
            radius: 8,
            fillColor: "#2563eb",
            color: "#ffffff",
            weight: 3,
            opacity: 1,
            fillOpacity: 0.9
          }).addTo(map).bindPopup("<b>您所在的位置</b>").openPopup();

          places.forEach(c => {
            c.distance = calculateDistance(uLat, uLng, c.lat, c.lng).toFixed(1);
          });
          places.sort((a, b) => parseFloat(a.distance) - parseFloat(b.distance));
          applyFilter();
          alert("已定位成功！所有地点已按与您的距离由近到远重新排序。");
        },
        err => {
          alert("无法获取定位权限，请在手机设置中允许浏览器访问位置。");
        }
      );
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

      });
    }

      document.getElementById("feedbackModal").classList.add("hidden");
    }
    function handleFeedbackSubmit(e) {
      e.preventDefault();
      alert("感谢提报！我们会尽快核准更新。");
      closeModal();
    }

    window.onload = initMap;
  </script>
